name: Validate source publication (no binaries)

'on':
  workflow_dispatch:
    inputs:
      confirm_source_only:
        description: Run source checks only; no binary build, upload or publication
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: source-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-source:
    # Fail closed for other events, refs or an unconfirmed manual request.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_source_only == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            architecture: x64
          - os: macos-14
            architecture: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
      - run: python -m pip install -r requirements.txt "pyinstaller>=6.16,<7" "pip-audit==2.10.1"
      - run: python repository_audit.py --fail-on-secrets --output audit-report.json
      - run: python -m pip_audit --strict
      - run: python -m unittest discover -s tests
      - run: node tests/test_theme.cjs
      - run: node tests/test_appearance.cjs
      - run: node tests/test_workspace.cjs
      - run: node tests/test_snapshot_polling.cjs
      - run: node tests/test_fonts.cjs
      - run: node tests/test_i18n.cjs
      - run: node tests/test_platform_directory.cjs
      # No packaging commands, artifact uploads, release credentials or publisher.
      # Historical tag trees retain old workflows; keep repository Actions disabled
      # until those paths and hosted runs receive a separate maintainer review.
