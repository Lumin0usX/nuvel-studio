name: Local repository credential audit
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python repository_audit.py --fail-on-secrets --output audit-report.json
      # No report upload: even redacted locations/identifiers stay out of artifacts.
